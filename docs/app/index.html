<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LeafDoctor</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 640px; margin: 0 auto; padding: 24px 16px; color: #1d2420; background: #f6f5f0; }
  h1 { margin: 0 0 8px; }
  img { max-width: 100%; max-height: 320px; border-radius: 8px; margin: 12px 0; display: block; }
  .unsure { background: #fff4dd; border: 1px solid #e2b54a; padding: 10px 12px; border-radius: 8px; font-weight: 600; }
  .row { display: flex; justify-content: space-between; margin-top: 10px; }
  .bar { height: 8px; background: #dcdfd8; border-radius: 4px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: #3f8a5c; }
  .note { color: #5b6660; font-size: .9rem; margin-top: 24px; }
</style>
</head>
<body>
<h1>LeafDoctor</h1>
<p>Upload a photo of one leaf. It is checked in your browser and never uploaded.</p>
<input id="file" type="file" accept="image/*">
<p id="status">Loading model…</p>
<img id="preview" alt="" hidden>
<div id="result"></div>
<p class="note">Disclaimer: student project, often wrong on real field photos; not a diagnosis, so confirm with a local agricultural expert.</p>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/ort.min.js"></script>
<script>
const LABELS = ["Apple — scab", "Apple — cedar apple rust", "Apple — healthy", "Blueberry — healthy", "Cherry — healthy", "Corn — gray leaf spot", "Corn — common rust", "Corn — northern leaf blight", "Grape — black rot", "Grape — healthy", "Peach — healthy", "Bell pepper — bacterial spot", "Bell pepper — healthy", "Potato — early blight", "Potato — late blight", "Raspberry — healthy", "Soybean — healthy", "Squash — powdery mildew", "Strawberry — healthy", "Tomato — bacterial spot", "Tomato — early blight", "Tomato — late blight", "Tomato — leaf mold", "Tomato — Septoria leaf spot", "Tomato — mosaic virus", "Tomato — yellow leaf curl virus", "Tomato — healthy"];  // data/class_map.csv order = model output order
const MEAN = [0.485, 0.456, 0.406], STD = [0.229, 0.224, 0.225], SIZE = 224;
const status = document.getElementById("status");
let session;
ort.env.wasm.numThreads = 1;
ort.InferenceSession.create("model.onnx", { executionProviders: ["wasm"] })
  .then((s) => { session = s; status.textContent = "Ready."; })
  .catch((e) => { status.textContent = "Could not load the model: " + e; });

document.getElementById("file").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (!file || !session) return;
  status.textContent = "Checking…";
  const img = await createImageBitmap(file, { imageOrientation: "from-image" });
  const canvas = document.createElement("canvas");
  canvas.width = canvas.height = SIZE;
  const ctx = canvas.getContext("2d");
  ctx.imageSmoothingQuality = "high";
  ctx.drawImage(img, 0, 0, SIZE, SIZE);  // direct resize to 224x224, as in training
  const px = ctx.getImageData(0, 0, SIZE, SIZE).data, n = SIZE * SIZE, x = new Float32Array(3 * n);
  for (let i = 0; i < n; i++) for (let c = 0; c < 3; c++) x[c * n + i] = (px[4 * i + c] / 255 - MEAN[c]) / STD[c];
  const out = await session.run({ input: new ort.Tensor("float32", x, [1, 3, SIZE, SIZE]) });
  const z = Array.from(out.logits.data), m = Math.max(...z), ex = z.map((v) => Math.exp(v - m)), s = ex.reduce((a, b) => a + b);
  const top = ex.map((v, i) => [v / s, i]).sort((a, b) => b[0] - a[0]).slice(0, 3);
  const prev = document.getElementById("preview");
  prev.src = URL.createObjectURL(file); prev.hidden = false;
  document.getElementById("result").innerHTML =
    (top[0][0] < 0.5 ? '<p class="unsure">Unsure: ask a local agricultural expert</p>' : "") +
    top.map(([p, i]) => `<div class="row"><span>${LABELS[i]}</span><span>${(100 * p).toFixed(1)}%</span></div>` +
      `<div class="bar"><i style="width:${(100 * p).toFixed(1)}%"></i></div>`).join("");
  status.textContent = "Done.";
  e.target.value = "";
});
</script>
</body>
</html>
